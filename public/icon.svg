<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer rim border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ea580c" stroke-width="4" stroke-opacity="0.3" />

  <!-- Industrial Furnace Flame Icon -->
  <g filter="url(#glow)">
    <path d="M 256,70 C 275,140 330,175 330,240 C 330,270 315,295 290,310 C 320,300 375,270 375,210 C 375,325 295,420 256,435 C 217,420 137,325 137,210 C 137,270 192,300 222,310 C 197,295 182,270 182,240 C 182,175 237,140 256,70 Z" fill="url(#flameGrad)" />
    <!-- Inner Core Flame -->
    <path d="M 256,220 C 268,260 295,285 295,325 C 295,365 265,395 256,400 C 247,395 217,365 217,325 C 217,285 244,260 256,220 Z" fill="#fef08a" />
  </g>

  <!-- Attendance Badge / Checkmark -->
  <circle cx="360" cy="360" r="70" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6" />
  <path d="M 335,360 L 352,377 L 388,340" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text P4 Badge -->
  <rect x="100" y="325" width="90" height="48" rx="12" fill="#ea580c" />
  <text x="145" y="358" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">P4</text>
</svg>
